# Dev deploy on every push to main: the CI checks, then the image to ACR, the database migration, the app's database
# user, the Bicep, and a smoke test. Signs in to Azure with OIDC as the federated identity ft-dev-deploy (no client
# secret anywhere); its rights are Contributor and User Access Administrator on FocusTime-dev only, and membership of
# "FocusTime DB Admins" for the database steps. See docs/azure/runbook.md.
name: deploy-dev
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-dev
  cancel-in-progress: false
jobs:
  # D456: when the merged commit came from a PR whose ci run passed on exactly the same tree, that run already tested
  # this code: skip the full suite and run only the typecheck (and the smoke test after the deploy). Otherwise (a push
  # that wasn't a PR, main moved since the PR's last run, no artifact) run all of ci.yml first, as before.
  reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
      pr: ${{ steps.check.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
      - name: Did the PR's ci test this tree?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-tree-match.sh "${{ github.repository }}" "${{ github.sha }}"
  ci:
    needs: reuse
    if: needs.reuse.outputs.tested != 'true'
    uses: ./.github/workflows/ci.yml
  typecheck:
    needs: reuse
    if: needs.reuse.outputs.tested == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
  deploy:
    needs: [reuse, ci, typecheck]
    # One of ci or typecheck ran and passed; the other was skipped.
    if: ${{ !cancelled() && !failure() && (needs.ci.result == 'success' || needs.typecheck.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      RG: ${{ vars.AZURE_DEV_RESOURCE_GROUP }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEV_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Find the resources
        run: |
          az bicep install
          echo "ACR=$(az acr list -g "$RG" --query '[0].name' -o tsv)" >> "$GITHUB_ENV"
          echo "SQL_SERVER=$(az sql server list -g "$RG" --query '[0].name' -o tsv)" >> "$GITHUB_ENV"
          echo "SQL_FQDN=$(az sql server list -g "$RG" --query '[0].fullyQualifiedDomainName' -o tsv)" >> "$GITHUB_ENV"
      # S1 (D452): the build info baked in: short sha, the PR (the reuse job's answer from GitHub, else the merge
      # message's "(#N)"), the build time. No secrets.
      - name: Build info
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: node scripts/build-info.ts "${{ github.sha }}" "${{ needs.reuse.outputs.pr }}" "$MESSAGE" >> "$GITHUB_ENV"
      - name: Build and push the image
        run: |
          az acr login -n "$ACR"
          docker build --build-arg BUILD_SHA="$BUILD_SHA" --build-arg BUILD_PR="$BUILD_PR" --build-arg BUILD_TIME="$BUILD_TIME" -t "$ACR.azurecr.io/focustime:$TAG" .
          docker push "$ACR.azurecr.io/focustime:$TAG"
      # The runner reaches the database through a firewall rule for its own address, added here and removed at the end
      # of the job whatever happens; the server otherwise allows Azure services only.
      - name: Open the database to this runner
        run: |
          ip=$(curl -fsS https://api.ipify.org)
          az sql server firewall-rule create -g "$RG" -s "$SQL_SERVER" -n "gh-run-${{ github.run_id }}" --start-ip-address "$ip" --end-ip-address "$ip" -o none
      - name: Migrate the database
        env:
          FOCUSTIME_DB_DRIVER: sqlserver
          FOCUSTIME_DB_SERVER: ${{ env.SQL_FQDN }}
          FOCUSTIME_DB_PORT: "1433"
          FOCUSTIME_DB_NAME: focustime
          FOCUSTIME_DB_AUTH: entra
        run: node scripts/focustime.ts migrate
      - name: The app's database user
        run: node scripts/db-user.ts --server "$SQL_FQDN" --database focustime --principal ft-dev-app --client-id "${{ vars.AZURE_DEV_APP_IDENTITY_CLIENT_ID }}"
      - name: Deploy the Bicep (what-if, then create)
        env:
          FT_IMAGE_TAG: ${{ github.sha }}
          FT_APP_READY: "true"
          FT_ADMINS: ${{ vars.FT_ADMINS }}
          FT_ADMIN_GROUP_ID: ${{ vars.FT_ADMIN_GROUP_ID }}
          FT_BUDGET_EMAIL: ${{ vars.FT_BUDGET_EMAIL }}
        run: |
          # HK-2: the budget alert address stays out of the log (the what-if prints it).
          [[ -z "$FT_BUDGET_EMAIL" ]] || echo "::add-mask::$FT_BUDGET_EMAIL"
          az deployment group what-if -g "$RG" -n ft-dev --parameters infra/dev.bicepparam --exclude-change-types NoChange Ignore
          az deployment group create -g "$RG" -n ft-dev --parameters infra/dev.bicepparam --query properties.outputs.publicUrl.value -o tsv > url.txt
          echo "APP_URL=$(cat url.txt)" >> "$GITHUB_ENV"
      - name: Smoke test
        run: |
          # The app may be scaled to zero and the database paused: allow a few minutes for both to wake.
          for i in $(seq 1 40); do curl -fsS "$APP_URL/healthz" && break; sleep 10; done
          curl -fsS "$APP_URL/healthz"
          # S1 (D452): the app serves the commit just deployed (a new revision can take a moment to take traffic).
          for i in $(seq 1 30); do
            served=$(curl -fsS "$APP_URL/version" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const v=JSON.parse(s);console.log(`${v.env} ${v.sha}`)})')
            [[ $served == "dev ${BUILD_SHA}" ]] && break
            sleep 10
          done
          echo "served: $served, deployed: dev ${BUILD_SHA}"
          [[ $served == "dev ${BUILD_SHA}" ]]
          curl -fsS "$APP_URL/" | grep -q "<title>FocusTime</title>"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/auth/microsoft/login")
          loc=$(curl -s -o /dev/null -w '%{redirect_url}' "$APP_URL/auth/microsoft/login")
          [[ $code == 302 && $loc == https://login.microsoftonline.com/* ]] || { echo "sign-in: $code ${loc%%\?*}"; exit 1; }
          curl -sI "$APP_URL/" | grep -iE '^(strict-transport-security|content-security-policy|x-frame-options|x-content-type-options):'
      - name: Close the database to this runner
        if: always() && env.SQL_SERVER != ''
        run: az sql server firewall-rule delete -g "$RG" -s "$SQL_SERVER" -n "gh-run-${{ github.run_id }}" -o none || true
